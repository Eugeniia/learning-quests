apiVersion: v1
kind: PersistentVolume
metadata:
  name: challenge-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: challenge
  hostPath:
    path: /data/challenge-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: challenge-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: challenge
  resources:
    requestes:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: challenge
  labels:
    name: challenge
spec:
  containers:
  - name: nginx
    image: nginx:latest
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 80
    volumeMounts:
      - name:  challenge-vl
        mountPath:  /var/www/html
  volumes:
    - name: challenge-vl
      persistentVolumeClaim:
        claimName: challenge-pvc